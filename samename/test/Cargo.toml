# Two crates both named "foo" (versions 0.1.0 and 0.2.0), renamed here, each
# with a component of type name "foo::Foo". Checks that component identity is
# the TypeId, not the type name.
[package]
name = "samename-test"
version = "0.1.0"
edition = "2021"

# A workspace of its own (the main workspace excludes it): two packages named
# "foo" cannot be members of one workspace. Run with
# `cargo test --manifest-path samename/test/Cargo.toml`.
[workspace]

[dependencies]
dataflow-flat = { path = "../../dataflow-flat" }
foo_a = { package = "foo", path = "../foo-v1" }
foo_b = { package = "foo", path = "../foo-v2" }

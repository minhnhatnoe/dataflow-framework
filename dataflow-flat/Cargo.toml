[package]
name = "dataflow-flat"
version = "0.1.0"
edition = "2021"

[dependencies]
dataflow-macros = { path = "../dataflow-macros" }

[features]
# Reject dependency cycles where they are written (E0275 naming
# `NoDependencyCycle`) instead of as E0391 on the plan's constants. Costs
# about +30% from-scratch debug build time on a 400-component graph.
cycle-diagnostics = []

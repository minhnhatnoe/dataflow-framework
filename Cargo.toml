[workspace]
resolver = "2"
# `samename` is a workspace of its own: it needs two packages named `foo`.
exclude = ["samename"]
members = ["dataflow-flat", "dataflow-macros", "example", "diamond", "bench"]
# `cargo build` / `cargo test` without -p: everything except the 400-component benchmark.
default-members = ["dataflow-flat", "dataflow-macros", "example", "diamond"]
